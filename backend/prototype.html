<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Goal Investment Advisor (Prototype)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 700px;
      margin: 0 auto;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 16px;
    }
    h1 {
      font-size: 18px;
      margin-top: 0;
    }
    #chat {
      height: 350px;
      overflow-y: auto;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 10px;
      background: #fafafa;
    }
    .msg {
      margin: 6px 0;
      max-width: 85%;
      padding: 6px 10px;
      border-radius: 6px;
      line-height: 1.3;
      word-wrap: break-word;
    }
    .user {
      background: #2563eb;
      color: #fff;
      margin-left: auto;
      text-align: right;
    }
    .assistant {
      background: #e5e7eb;
      color: #111;
    }
    .input-row {
      display: flex;
      gap: 8px;
    }
    input[type="text"] {
      flex: 1;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
    }
    button {
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      background: #2563eb;
      color: #fff;
      cursor: pointer;
      font-size: 14px;
    }
    button:disabled {
      background: #93c5fd;
      cursor: not-allowed;
    }
    .disclaimer {
      font-size: 11px;
      color: #666;
      margin-top: 10px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Goal-Based Investment Advisor (Prototype)</h1>
    <div id="chat"></div>
    <div class="input-row">
      <input id="msg" type="text" placeholder="Ask about investing for goals (e.g., retirement, child education)..." />
      <button id="send">Send</button>
    </div>
    <div class="disclaimer">
      Educational information only. Not personalized financial advice.
    </div>
  </div>

  <script>
    const chatEl = document.getElementById("chat");
    const inputEl = document.getElementById("msg");
    const sendBtn = document.getElementById("send");

    const API_URL = "http://localhost:8000/chat";

    function addMessage(role, text) {
      const div = document.createElement("div");
      div.className = "msg " + role;
      div.textContent = text;
      chatEl.appendChild(div);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;

      addMessage("user", text);
      inputEl.value = "";
      sendBtn.disabled = true;
      addMessage("assistant", "Thinking...");

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text })
        });

        if (!res.ok) {
          throw new Error("Server error: " + res.status);
        }

        const data = await res.json();
        // Remove "Thinking..." message (last one)
        chatEl.removeChild(chatEl.lastChild);
        addMessage("assistant", data.reply);
      } catch (err) {
        // Replace "Thinking..." with error
        chatEl.removeChild(chatEl.lastChild);
        addMessage("assistant", "Sorry, something went wrong: " + err.message);
      } finally {
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }

    sendBtn.addEventListener("click", sendMessage);
    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendMessage();
    });

    // Initial welcome message
    addMessage("assistant", "Hi! Ask me about goal-based investing (e.g., retirement, child education, house).");
  </script>
</body>
</html>
